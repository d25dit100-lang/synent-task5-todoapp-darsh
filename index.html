<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Darsh's To-Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      padding: 32px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #999;
      margin-bottom: 28px;
    }

    /* INPUT AREA */
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .input-area input {
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'Segoe UI', sans-serif;
      outline: none;
    }

    .input-area input:focus {
      border-color: #222;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: 'Segoe UI', sans-serif;
      outline: none;
      color: #555;
    }

    .input-row input:focus {
      border-color: #222;
    }

    .input-area button {
      padding: 11px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
    }

    .input-area button:hover {
      background: #444;
    }

    /* STATS */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: #999;
    }

    .stats span {
      background: #f4f4f4;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #eee;
    }

    /* TASK LIST */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
    }

    .task-item.completed {
      opacity: 0.55;
      background: #f9f9f9;
    }

    .task-item input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #222;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
    }

    .task-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #222;
    }

    .task-item.completed .task-name {
      text-decoration: line-through;
      color: #aaa;
    }

    .task-due {
      font-size: 0.78rem;
      color: #999;
      margin-top: 3px;
    }

    .task-due.overdue {
      color: #e05252;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #e05252;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 40px 0;
      color: #bbb;
      font-size: 0.9rem;
    }

    /* CLEAR BUTTON */
    .bottom-bar {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .clear-btn {
      background: none;
      border: 1px solid #eee;
      color: #aaa;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
    }

    .clear-btn:hover {
      border-color: #e05252;
      color: #e05252;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Stay organized, get things done.</p>

    <!-- INPUT -->
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <div class="input-row">
        <input type="date" id="dateInput" />
        <button onclick="addTask()">Add Task</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats">
      <span id="totalStat">Total: 0</span>
      <span id="doneStat">Done: 0</span>
      <span id="pendingStat">Pending: 0</span>
    </div>

    <!-- TASK LIST -->
    <div class="task-list" id="taskList">
      <div class="empty" id="emptyMsg">No tasks yet. Add one above!</div>
    </div>

    <!-- CLEAR ALL -->
    <div class="bottom-bar">
      <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const dateInput = document.getElementById('dateInput');
      const name = input.value.trim();

      if (name === '') {
        alert('Please enter a task!');
        return;
      }

      const task = {
        id: Date.now(),
        name: name,
        due: dateInput.value,
        completed: false
      };

      tasks.push(task);
      saveTasks();
      renderTasks();

      input.value = '';
      dateInput.value = '';
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
    }

    function isOverdue(due) {
      if (!due) return false;
      const today = new Date().toISOString().split('T')[0];
      return due < today;
    }

    function formatDate(due) {
      if (!due) return '';
      const d = new Date(due + 'T00:00:00');
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const emptyMsg = document.getElementById('emptyMsg');

      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      const pending = total - done;

      document.getElementById('totalStat').textContent = 'Total: ' + total;
      document.getElementById('doneStat').textContent = 'Done: ' + done;
      document.getElementById('pendingStat').textContent = 'Pending: ' + pending;

      // clear old tasks (keep empty msg)
      list.innerHTML = '';

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">No tasks yet. Add one above!</div>';
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'task-item' + (task.completed ? ' completed' : '');

        const overdue = !task.completed && isOverdue(task.due);

        item.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})" />
          <div class="task-info">
            <div class="task-name">${task.name}</div>
            ${task.due ? `<div class="task-due ${overdue ? 'overdue' : ''}">
              📅 ${formatDate(task.due)} ${overdue ? '— Overdue' : ''}
            </div>` : ''}
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
        `;

        list.appendChild(item);
      });
    }

    // Allow pressing Enter to add task
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    // Load tasks on page open
    renderTasks();
  </script>

</body>
</html>
